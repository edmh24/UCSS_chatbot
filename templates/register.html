{% extends "base.html" %}
{% block title %}Registro | UCSS{% endblock %}
{% block content %}
<div class="container h-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg border-0 p-4 rounded-4">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 70px; height: 70px; font-size: 1.8rem;">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Registro UCSS</h3>
                    <p class="text-muted small">Cree su cuenta institucional</p>
                </div>
                {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
                        <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endif %}
                {% if success %}
                    <div class="alert alert-success alert-dismissible fade show py-2 small" role="alert">
                        <i class="fa-solid fa-circle-check me-1"></i> {{ success }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endif %}
                <form method="POST" id="register-form">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nuevo usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Mínimo 3 caracteres" minlength="3" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" id="reg-password-field" class="form-control border-start-0 border-end-0 ps-0" placeholder="Mínimo 6 caracteres" minlength="6" required>
                            <button class="btn btn-light border border-start-0 text-secondary" type="button" id="reg-toggle-password" title="Mostrar contraseña"><i class="fa-solid fa-eye" id="reg-eye-icon"></i></button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold shadow-sm mb-3">Registrarse</button>
                    <div class="text-center">
                        <small class="text-muted">¿Ya tienes cuenta? <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-bold">Inicia sesión</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    const togglePassword = document.getElementById('reg-toggle-password');
    const passwordField = document.getElementById('reg-password-field');
    const eyeIcon = document.getElementById('reg-eye-icon');
    togglePassword.addEventListener('click', function () {
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);
        eyeIcon.classList.toggle('fa-eye');
        eyeIcon.classList.toggle('fa-eye-slash');
    });
</script>
{% endblock %}
